# Unsloth CLI Training Config
# How to run: unsloth train --config configs/recipe.yaml

model: unsloth/Llama-3.2-3B-Instruct-bnb-4bit

data:
  local_dataset:
    - data/datasets/train_clean.jsonl
  format_type: chatml

training:
  training_type: lora
  max_seq_length: 1024
  load_in_4bit: true
  output_dir: outputs/llama3-finetuned-v4
  num_epochs: 3
  learning_rate: 0.0001
  batch_size: 2
  gradient_accumulation_steps: 4
  warmup_steps: 150
  save_steps: 500
  weight_decay: 0.01
  random_seed: 42
  packing: false
  train_on_completions: true
  gradient_checkpointing: unsloth

lora:
  lora_r: 32
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
  use_rslora: true
  use_loftq: false